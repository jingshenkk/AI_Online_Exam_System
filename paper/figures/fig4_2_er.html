<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图4.2 数据库ER关系图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SimSun', 'STSong', 'Songti SC', serif;
            background: #fff;
            display: flex;
            justify-content: center;
            padding: 30px 10px;
        }
        svg { display: block; }
    </style>
</head>
<body>
<svg width="1100" height="920" viewBox="0 0 1100 920">
    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#333"/>
        </marker>
        <style>
            .module-label { font-size: 12px; font-weight: bold; fill: #000; font-family: 'SimHei', 'STHeiti', 'Heiti SC', sans-serif; }
            .table-title { font-size: 11.5px; font-weight: bold; fill: #000; font-family: 'SimHei', 'STHeiti', 'Heiti SC', sans-serif; }
            .field-text { font-size: 10.5px; fill: #000; font-family: 'Consolas', 'Monaco', 'SimSun', monospace; }
            .pk-text { font-size: 10.5px; fill: #000; font-weight: bold; font-family: 'Consolas', 'Monaco', 'SimSun', monospace; }
            .fk-text { font-size: 10.5px; fill: #555; font-style: italic; font-family: 'Consolas', 'Monaco', 'SimSun', monospace; }
            .fk-label { font-size: 8.5px; fill: #999; font-family: 'SimSun', 'STSong', 'Songti SC', serif; }
        </style>
    </defs>

    <!-- ==================== 模块1：用户管理模块 ==================== -->
    <rect x="20" y="20" width="320" height="280" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
    <rect x="35" y="10" width="100" height="18" fill="#fff"/>
    <text x="85" y="23" text-anchor="middle" class="module-label">用户管理模块</text>

    <!-- student 表 -->
    <rect x="40" y="40" width="180" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="130" y="53" text-anchor="middle" class="table-title">student（学生）</text>
    <rect x="40" y="58" width="180" height="112" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="50" y="74" class="pk-text">PK  id</text>
    <text x="50" y="90" class="field-text">    username</text>
    <text x="50" y="106" class="field-text">    password</text>
    <text x="50" y="122" class="field-text">    name</text>
    <text x="50" y="138" class="field-text">    student_id</text>
    <text x="50" y="154" class="field-text">    grade</text>
    <text x="50" y="170" class="field-text">    is_active</text>

    <!-- teacher 表 -->
    <rect x="40" y="185" width="180" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="130" y="198" text-anchor="middle" class="table-title">teacher（教师）</text>
    <rect x="40" y="203" width="180" height="112" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="50" y="219" class="pk-text">PK  id</text>
    <text x="50" y="235" class="field-text">    username</text>
    <text x="50" y="251" class="field-text">    password</text>
    <text x="50" y="267" class="field-text">    name</text>
    <text x="50" y="283" class="field-text">    teacher_id</text>
    <text x="50" y="299" class="field-text">    role</text>
    <text x="50" y="315" class="field-text">    is_active</text>

    <!-- ==================== 模块2：试题管理模块 ==================== -->
    <rect x="370" y="20" width="320" height="420" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
    <rect x="385" y="10" width="100" height="18" fill="#fff"/>
    <text x="435" y="23" text-anchor="middle" class="module-label">试题管理模块</text>

    <!-- questions 表 -->
    <rect x="390" y="40" width="200" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="490" y="53" text-anchor="middle" class="table-title">questions（试题）</text>
    <rect x="390" y="58" width="200" height="128" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="400" y="74" class="pk-text">PK  id</text>
    <text x="400" y="90" class="field-text">    topic</text>
    <text x="400" y="106" class="field-text">    options</text>
    <text x="400" y="122" class="field-text">    answer</text>
    <text x="400" y="138" class="field-text">    type</text>
    <text x="400" y="154" class="field-text">    grading_mode</text>
    <text x="400" y="170" class="field-text">    max_chars</text>
    <text x="400" y="186" class="field-text">    created_user</text>

    <!-- scoring_point 表 -->
    <rect x="390" y="200" width="200" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="490" y="213" text-anchor="middle" class="table-title">scoring_point（评分细则）</text>
    <rect x="390" y="218" width="200" height="112" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="400" y="234" class="pk-text">PK  id</text>
    <text x="400" y="250" class="fk-text">FK  question_id</text>
    <text x="400" y="266" class="field-text">    description</text>
    <text x="400" y="282" class="field-text">    score</text>
    <text x="400" y="298" class="field-text">    acceptable_expressions</text>
    <text x="400" y="314" class="field-text">    is_approved</text>
    <text x="400" y="330" class="field-text">    sort_order</text>

    <!-- questions_favorite 表 -->
    <rect x="390" y="345" width="200" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="490" y="358" text-anchor="middle" class="table-title">questions_favorite（收藏）</text>
    <rect x="390" y="363" width="200" height="64" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="400" y="379" class="pk-text">PK  id</text>
    <text x="400" y="395" class="fk-text">FK  question_id</text>
    <text x="400" y="411" class="field-text">    collector</text>

    <!-- questions → scoring_point 连线 -->
    <line x1="490" y1="186" x2="490" y2="200" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- questions → questions_favorite 连线 -->
    <line x1="530" y1="186" x2="530" y2="340" stroke="#333" stroke-width="0.8"/>
    <line x1="530" y1="340" x2="530" y2="345" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <!-- ==================== 模块3：试卷管理模块 ==================== -->
    <rect x="720" y="20" width="350" height="420" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
    <rect x="735" y="10" width="100" height="18" fill="#fff"/>
    <text x="785" y="23" text-anchor="middle" class="module-label">试卷管理模块</text>

    <!-- paper 表 -->
    <rect x="740" y="40" width="210" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="845" y="53" text-anchor="middle" class="table-title">paper（试卷）</text>
    <rect x="740" y="58" width="210" height="128" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="750" y="74" class="pk-text">PK  id</text>
    <text x="750" y="90" class="field-text">    title</text>
    <text x="750" y="106" class="field-text">    description</text>
    <text x="750" y="122" class="field-text">    duration_minutes</text>
    <text x="750" y="138" class="field-text">    total_marks</text>
    <text x="750" y="154" class="field-text">    is_published</text>
    <text x="750" y="170" class="field-text">    grading_mode</text>
    <text x="750" y="186" class="field-text">    created_user</text>

    <!-- paper_module 表 -->
    <rect x="740" y="200" width="210" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="845" y="213" text-anchor="middle" class="table-title">paper_module（模块）</text>
    <rect x="740" y="218" width="210" height="96" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="750" y="234" class="pk-text">PK  id</text>
    <text x="750" y="250" class="fk-text">FK  paper_id</text>
    <text x="750" y="266" class="field-text">    title</text>
    <text x="750" y="282" class="field-text">    description</text>
    <text x="750" y="298" class="field-text">    sequence_number</text>

    <!-- paper_questions 表 -->
    <rect x="740" y="330" width="210" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="845" y="343" text-anchor="middle" class="table-title">paper_questions（关联）</text>
    <rect x="740" y="348" width="210" height="96" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="750" y="364" class="pk-text">PK  id</text>
    <text x="750" y="380" class="fk-text">FK  paper_id</text>
    <text x="750" y="396" class="fk-text">FK  question_id</text>
    <text x="750" y="412" class="field-text">    marks</text>
    <text x="750" y="428" class="field-text">    sequence_number</text>
    <text x="750" y="444" class="field-text">    module</text>

    <!-- paper → paper_module 连线 -->
    <line x1="845" y1="186" x2="845" y2="200" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- paper → paper_questions 连线 -->
    <line x1="890" y1="186" x2="890" y2="330" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <!-- ==================== 模块4：考试管理模块 ==================== -->
    <rect x="20" y="470" width="320" height="430" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
    <rect x="35" y="460" width="100" height="18" fill="#fff"/>
    <text x="85" y="473" text-anchor="middle" class="module-label">考试管理模块</text>

    <!-- exam 表 -->
    <rect x="40" y="490" width="200" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="140" y="503" text-anchor="middle" class="table-title">exam（考试）</text>
    <rect x="40" y="508" width="200" height="128" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="50" y="524" class="pk-text">PK  id</text>
    <text x="50" y="540" class="fk-text">FK  paper_id</text>
    <text x="50" y="556" class="field-text">    title</text>
    <text x="50" y="572" class="field-text">    start_time</text>
    <text x="50" y="588" class="field-text">    end_time</text>
    <text x="50" y="604" class="field-text">    pass_mark</text>
    <text x="50" y="620" class="field-text">    is_published</text>
    <text x="50" y="636" class="field-text">    created_user</text>

    <!-- exam_result 表 -->
    <rect x="40" y="650" width="200" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="140" y="663" text-anchor="middle" class="table-title">exam_result（结果）</text>
    <rect x="40" y="668" width="200" height="112" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="50" y="684" class="pk-text">PK  id</text>
    <text x="50" y="700" class="fk-text">FK  exam_id</text>
    <text x="50" y="716" class="fk-text">FK  student_id</text>
    <text x="50" y="732" class="field-text">    result_mark</text>
    <text x="50" y="748" class="field-text">    start_time</text>
    <text x="50" y="764" class="field-text">    end_time</text>
    <text x="50" y="780" class="field-text">    ending_status</text>

    <!-- exam_result_detail 表 -->
    <rect x="40" y="795" width="200" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="140" y="808" text-anchor="middle" class="table-title">exam_result_detail（明细）</text>
    <rect x="40" y="813" width="200" height="80" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="50" y="829" class="pk-text">PK  id</text>
    <text x="50" y="845" class="fk-text">FK  exam_result_id</text>
    <text x="50" y="861" class="fk-text">FK  question_id</text>
    <text x="50" y="877" class="field-text">    mark</text>
    <text x="50" y="893" class="field-text">    solution</text>

    <!-- exam → exam_result 连线 -->
    <line x1="140" y1="636" x2="140" y2="650" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- exam_result → exam_result_detail 连线 -->
    <line x1="140" y1="780" x2="140" y2="795" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ==================== 模块5：智能评分模块 ==================== -->
    <rect x="370" y="470" width="320" height="430" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
    <rect x="385" y="460" width="100" height="18" fill="#fff"/>
    <text x="435" y="473" text-anchor="middle" class="module-label">智能评分模块</text>

    <!-- answer_record 表 -->
    <rect x="390" y="490" width="210" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="495" y="503" text-anchor="middle" class="table-title">answer_record（答题记录）</text>
    <rect x="390" y="508" width="210" height="128" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="400" y="524" class="pk-text">PK  id</text>
    <text x="400" y="540" class="fk-text">FK  question_id</text>
    <text x="400" y="556" class="fk-text">FK  student_id</text>
    <text x="400" y="572" class="fk-text">FK  exam_result_id</text>
    <text x="400" y="588" class="field-text">    answer_text</text>
    <text x="400" y="604" class="field-text">    grading_mode</text>
    <text x="400" y="620" class="field-text">    final_score</text>
    <text x="400" y="636" class="field-text">    status</text>

    <!-- score_point_detail 表 -->
    <rect x="390" y="650" width="210" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="495" y="663" text-anchor="middle" class="table-title">score_point_detail（评分明细）</text>
    <rect x="390" y="668" width="210" height="128" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="400" y="684" class="pk-text">PK  id</text>
    <text x="400" y="700" class="fk-text">FK  answer_record_id</text>
    <text x="400" y="716" class="fk-text">FK  scoring_point_id</text>
    <text x="400" y="732" class="field-text">    llm_1_hit</text>
    <text x="400" y="748" class="field-text">    llm_2_hit</text>
    <text x="400" y="764" class="field-text">    llm_3_hit</text>
    <text x="400" y="780" class="field-text">    final_hit</text>
    <text x="400" y="796" class="field-text">    vote_count</text>

    <!-- answer_draft 表 -->
    <rect x="390" y="810" width="210" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="495" y="823" text-anchor="middle" class="table-title">answer_draft（草稿）</text>
    <rect x="390" y="828" width="210" height="64" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="400" y="844" class="pk-text">PK  id</text>
    <text x="400" y="860" class="fk-text">FK  exam_result_id</text>
    <text x="400" y="876" class="fk-text">FK  question_id</text>
    <text x="400" y="892" class="field-text">    answer</text>

    <!-- answer_record → score_point_detail 连线 -->
    <line x1="495" y1="636" x2="495" y2="650" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ==================== 模块6：系统管理 ==================== -->
    <rect x="720" y="470" width="350" height="200" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
    <rect x="735" y="460" width="80" height="18" fill="#fff"/>
    <text x="775" y="473" text-anchor="middle" class="module-label">系统管理</text>

    <!-- menu 表 -->
    <rect x="740" y="490" width="200" height="18" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="840" y="503" text-anchor="middle" class="table-title">menu（菜单）</text>
    <rect x="740" y="508" width="200" height="96" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="750" y="524" class="pk-text">PK  id</text>
    <text x="750" y="540" class="field-text">    code</text>
    <text x="750" y="556" class="field-text">    name</text>
    <text x="750" y="572" class="field-text">    path</text>
    <text x="750" y="588" class="field-text">    parent_code</text>
    <text x="750" y="604" class="field-text">    order</text>

    <!-- ==================== 跨模块关联连线（走模块外侧绕行） ==================== -->
    <!-- paper → exam（试卷 → 考试）：从paper左侧出发，沿模块外侧下行，到exam模块上方进入 -->
    <path d="M 740 130 L 700 130 L 700 450 L 140 450 L 140 490" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- questions → paper_questions（试题 → 试卷关联）：从questions右侧出发，沿两模块间上方空隙走到paper_questions -->
    <path d="M 590 120 L 700 120 L 700 396 L 740 396" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- exam_result → answer_record（考试结果 → 答题记录）：从exam_result右侧出发，沿两模块底部外侧绕行 -->
    <path d="M 240 730 L 350 730 L 350 910 L 495 910 L 495 892" fill="none" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- scoring_point → score_point_detail（评分细则 → 评分明细）：从scoring_point右侧出发，走模块外侧下行 -->
    <path d="M 590 280 L 700 280 L 700 716 L 600 716" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

</svg>
</body>
</html>
