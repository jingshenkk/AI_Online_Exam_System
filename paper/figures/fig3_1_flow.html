<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图3.1 智能评分方案整体流程图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SimSun', 'STSong', 'Songti SC', serif;
            background: #fff;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }
    </style>
</head>
<body>
<svg width="820" height="680" viewBox="0 0 820 680">
    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#333"/>
        </marker>
        <style>
            .label { font-size: 13px; fill: #000; font-family: 'SimSun', 'STSong', serif; }
            .label-bold { font-size: 13px; fill: #000; font-weight: bold; font-family: 'SimHei', 'STHeiti', sans-serif; }
            .label-small { font-size: 11px; fill: #555; font-family: 'SimSun', 'STSong', serif; }
            .stage-label { font-size: 14px; fill: #000; font-weight: bold; font-family: 'SimHei', 'STHeiti', sans-serif; }
        </style>
    </defs>

    <!-- ==================== 第一阶段虚线框 ==================== -->
    <rect x="20" y="10" width="780" height="270" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="6,3"/>
    <text x="40" y="32" class="stage-label">第一阶段：评分细则生成</text>

    <!-- 节点：教师创建试题 -->
    <rect x="50" y="60" width="130" height="36" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="115" y="83" text-anchor="middle" class="label">教师创建试题</text>

    <!-- 箭头 -->
    <line x1="180" y1="78" x2="220" y2="78" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 节点：输入标准答案与总分 -->
    <rect x="222" y="60" width="150" height="36" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="297" y="83" text-anchor="middle" class="label">输入标准答案与总分</text>

    <!-- 箭头 -->
    <line x1="372" y1="78" x2="412" y2="78" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 节点：rubric_chain（加粗框表示核心组件） -->
    <rect x="414" y="55" width="170" height="46" fill="#e8e8e8" stroke="#000" stroke-width="1.2"/>
    <text x="499" y="74" text-anchor="middle" class="label-bold">rubric_chain</text>
    <text x="499" y="91" text-anchor="middle" class="label-small">评分细则生成链</text>

    <!-- 箭头 -->
    <line x1="584" y1="78" x2="624" y2="78" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 节点：生成得分点列表 -->
    <rect x="626" y="60" width="140" height="36" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="696" y="83" text-anchor="middle" class="label">生成得分点列表</text>

    <!-- 箭头向下 -->
    <line x1="696" y1="96" x2="696" y2="140" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 菱形：教师审核 -->
    <polygon points="696,142 760,172 696,202 632,172" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="696" y="176" text-anchor="middle" class="label">教师审核</text>

    <!-- 审核通过：向下 -->
    <line x1="696" y1="202" x2="696" y2="245" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="710" y="226" class="label-small">通过</text>

    <!-- 审核不通过：从菱形左侧出发，绕过节点上方回到rubric_chain -->
    <line x1="632" y1="172" x2="590" y2="172" stroke="#333" stroke-width="1"/>
    <line x1="590" y1="172" x2="590" y2="130" stroke="#333" stroke-width="1"/>
    <line x1="590" y1="130" x2="499" y2="130" stroke="#333" stroke-width="1"/>
    <line x1="499" y1="130" x2="499" y2="105" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="545" y="125" class="label-small">不通过，返回修改</text>

    <!-- 节点：存入数据库 -->
    <rect x="626" y="247" width="140" height="26" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
    <text x="696" y="265" text-anchor="middle" class="label">存入数据库</text>

    <!-- ==================== 阶段间连接 ==================== -->
    <line x1="696" y1="273" x2="696" y2="305" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
    <line x1="696" y1="305" x2="410" y2="305" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
    <line x1="410" y1="305" x2="410" y2="335" stroke="#333" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="500" y="318" text-anchor="middle" class="label-small">审核通过的评分细则</text>

    <!-- ==================== 第二阶段虚线框 ==================== -->
    <rect x="20" y="330" width="780" height="330" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="6,3"/>
    <text x="40" y="352" class="stage-label">第二阶段：学生答案评分</text>

    <!-- 节点：学生提交答案 -->
    <rect x="50" y="380" width="130" height="36" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="115" y="403" text-anchor="middle" class="label">学生提交答案</text>

    <!-- 箭头 -->
    <line x1="180" y1="398" x2="220" y2="398" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 节点：获取评分细则 -->
    <rect x="222" y="380" width="130" height="36" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="287" y="403" text-anchor="middle" class="label">获取评分细则</text>

    <!-- 箭头 -->
    <line x1="352" y1="398" x2="392" y2="398" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 菱形：评分模式判定 -->
    <polygon points="460,368 528,398 460,428 392,398" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="460" y="402" text-anchor="middle" class="label">评分模式</text>

    <!-- 宽松模式分支：向上 -->
    <line x1="460" y1="368" x2="460" y2="340" stroke="#333" stroke-width="0.8"/>
    <line x1="460" y1="340" x2="600" y2="340" stroke="#333" stroke-width="0.8"/>
    <line x1="600" y1="340" x2="600" y2="370" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="510" y="335" class="label-small">宽松模式</text>

    <!-- 严格模式分支：向下 -->
    <line x1="460" y1="428" x2="460" y2="460" stroke="#333" stroke-width="0.8"/>
    <line x1="460" y1="460" x2="600" y2="460" stroke="#333" stroke-width="0.8"/>
    <line x1="600" y1="460" x2="600" y2="448" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="510" y="455" class="label-small">严格模式</text>

    <!-- 宽松模式节点 -->
    <rect x="545" y="372" width="110" height="36" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="600" y="388" text-anchor="middle" class="label-bold">score_chain</text>
    <text x="600" y="402" text-anchor="middle" class="label-small">单次LLM评分</text>

    <!-- 严格模式节点（双线框表示多次调用） -->
    <rect x="540" y="440" width="120" height="50" fill="#e8e8e8" stroke="#000" stroke-width="1.2"/>
    <rect x="543" y="443" width="114" height="44" fill="#e8e8e8" stroke="#000" stroke-width="0.6"/>
    <text x="600" y="462" text-anchor="middle" class="label-bold">score_chain ×3</text>
    <text x="600" y="478" text-anchor="middle" class="label-small">三次独立评分</text>

    <!-- 宽松模式箭头向右 -->
    <line x1="655" y1="390" x2="695" y2="390" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 严格模式箭头向右到投票 -->
    <line x1="660" y1="465" x2="695" y2="465" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 投票节点 -->
    <rect x="697" y="443" width="80" height="44" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="737" y="462" text-anchor="middle" class="label-bold">逐点投票</text>
    <text x="737" y="478" text-anchor="middle" class="label-small">多数决定</text>

    <!-- 汇聚：宽松模式和严格模式汇入"逐点评分结果" -->
    <!-- 宽松→逐点评分结果 -->
    <rect x="697" y="372" width="80" height="36" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="737" y="395" text-anchor="middle" class="label">逐点结果</text>

    <!-- 两路汇聚到写入成绩 -->
    <line x1="737" y1="408" x2="737" y2="510" stroke="#333" stroke-width="0.8"/>
    <line x1="737" y1="487" x2="737" y2="510" stroke="#333" stroke-width="0.8"/>
    <line x1="737" y1="510" x2="460" y2="510" stroke="#333" stroke-width="0.8"/>
    <line x1="460" y1="510" x2="460" y2="540" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 节点：汇总得分 -->
    <rect x="390" y="542" width="140" height="36" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="460" y="565" text-anchor="middle" class="label">汇总得分，写入成绩</text>

    <!-- 箭头到结束 -->
    <line x1="460" y1="578" x2="460" y2="610" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 结束：圆角矩形 -->
    <rect x="390" y="612" width="140" height="32" rx="16" ry="16" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
    <text x="460" y="633" text-anchor="middle" class="label">评分完成</text>

</svg>
</body>
</html>
