<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图4.1 系统整体架构图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SimSun', 'STSong', 'Songti SC', serif;
            background: #fff;
            display: flex;
            justify-content: center;
            padding: 30px 10px;
        }
        svg { display: block; }
    </style>
</head>
<body>
<svg width="880" height="620" viewBox="0 0 880 620">
    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#333"/>
        </marker>
        <style>
            .layer-title { font-size: 14px; font-weight: bold; fill: #000; font-family: 'SimHei', 'STHeiti', 'Heiti SC', sans-serif; }
            .item-text { font-size: 12px; fill: #000; font-family: 'SimSun', 'STSong', 'Songti SC', serif; }
            .note-text { font-size: 10.5px; fill: #555; font-family: 'SimSun', 'STSong', 'Songti SC', serif; }
            .module-text { font-size: 11.5px; font-weight: bold; fill: #000; font-family: 'SimHei', 'STHeiti', 'Heiti SC', sans-serif; }
        </style>
    </defs>

    <!-- ===== 第1层：用户层 ===== -->
    <rect x="200" y="20" width="480" height="60" fill="#f0f0f0" stroke="#000" stroke-width="1.2"/>
    <text x="440" y="40" text-anchor="middle" class="layer-title">用户层</text>
    <rect x="240" y="48" width="110" height="26" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="295" y="65" text-anchor="middle" class="item-text">管理员</text>
    <rect x="385" y="48" width="110" height="26" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="440" y="65" text-anchor="middle" class="item-text">教师</text>
    <rect x="530" y="48" width="110" height="26" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="585" y="65" text-anchor="middle" class="item-text">学生</text>

    <!-- 箭头：用户层 → 前端层 -->
    <line x1="440" y1="80" x2="440" y2="110" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== 第2层：前端层 ===== -->
    <rect x="100" y="110" width="680" height="100" fill="#f0f0f0" stroke="#000" stroke-width="1.2"/>
    <text x="440" y="132" text-anchor="middle" class="layer-title">前端层（Vue 3 + Element Plus + TypeScript）</text>
    <!-- 功能模块 -->
    <rect x="130" y="142" width="110" height="28" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="185" y="160" text-anchor="middle" class="item-text">用户管理</text>
    <rect x="255" y="142" width="110" height="28" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="310" y="160" text-anchor="middle" class="item-text">试题管理</text>
    <rect x="380" y="142" width="110" height="28" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="435" y="160" text-anchor="middle" class="item-text">试卷管理</text>
    <rect x="505" y="142" width="110" height="28" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="560" y="160" text-anchor="middle" class="item-text">考试管理</text>
    <rect x="630" y="142" width="120" height="28" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="690" y="160" text-anchor="middle" class="item-text">成绩管理</text>
    <!-- 注释 -->
    <text x="440" y="195" text-anchor="middle" class="note-text">Axios HTTP Client（JWT Token）</text>

    <!-- 箭头：前端层 → 后端层 -->
    <line x1="440" y1="210" x2="440" y2="240" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="480" y="230" text-anchor="start" class="note-text">RESTful API</text>

    <!-- ===== 第3层：后端层 ===== -->
    <rect x="60" y="240" width="760" height="220" fill="#f0f0f0" stroke="#000" stroke-width="1.2"/>
    <text x="440" y="262" text-anchor="middle" class="layer-title">后端层（Django 4.2 + DRF 3.14）</text>

    <!-- 中间件条 -->
    <rect x="140" y="274" width="580" height="28" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="440" y="293" text-anchor="middle" class="item-text">CORS中间件　|　JWT认证中间件　|　路由分发</text>

    <!-- 业务应用 -->
    <rect x="90" y="316" width="110" height="30" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="145" y="335" text-anchor="middle" class="item-text">UserMgmt</text>
    <rect x="212" y="316" width="110" height="30" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="267" y="335" text-anchor="middle" class="item-text">QuestionMgmt</text>
    <rect x="334" y="316" width="110" height="30" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="389" y="335" text-anchor="middle" class="item-text">PaperMgmt</text>
    <rect x="456" y="316" width="110" height="30" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="511" y="335" text-anchor="middle" class="item-text">ExamMgmt</text>
    <rect x="578" y="316" width="110" height="30" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="633" y="335" text-anchor="middle" class="item-text">ExamResult</text>
    <rect x="700" y="316" width="100" height="30" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="750" y="335" text-anchor="middle" class="item-text">MenuMgmt</text>

    <!-- 服务层 -->
    <rect x="200" y="366" width="240" height="34" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="320" y="388" text-anchor="middle" class="module-text">LLM评分服务（LangChain）</text>
    <rect x="470" y="366" width="200" height="34" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
    <text x="570" y="388" text-anchor="middle" class="module-text">Excel处理服务</text>

    <!-- 箭头：后端层 → 数据层 -->
    <line x1="440" y1="460" x2="440" y2="490" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== 第4层：数据层 ===== -->
    <rect x="100" y="490" width="680" height="100" fill="#f0f0f0" stroke="#000" stroke-width="1.2"/>
    <text x="440" y="514" text-anchor="middle" class="layer-title">数据层</text>

    <rect x="150" y="526" width="260" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="280" y="544" text-anchor="middle" class="item-text">MySQL 8.2 关系型数据库</text>
    <text x="280" y="560" text-anchor="middle" class="note-text">（15张业务表）</text>

    <rect x="470" y="526" width="260" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="600" y="544" text-anchor="middle" class="item-text">LLM服务（DeepSeek-V3.2）</text>
    <text x="600" y="560" text-anchor="middle" class="note-text">OpenAI兼容API</text>

</svg>
</body>
</html>
