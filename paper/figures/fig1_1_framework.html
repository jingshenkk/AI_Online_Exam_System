<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图1.1 研究内容框架图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SimSun', 'STSong', 'Songti SC', serif;
            background: #fff;
            display: flex;
            justify-content: center;
            padding: 30px 10px;
        }
        svg { display: block; }
    </style>
</head>
<body>
<svg width="880" height="540" viewBox="0 0 880 540">
    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#333"/>
        </marker>
        <style>
            .title-text { font-size: 15px; font-weight: bold; fill: #000; font-family: 'SimHei', 'STHeiti', 'Heiti SC', sans-serif; }
            .module-text { font-size: 13px; font-weight: bold; fill: #000; font-family: 'SimHei', 'STHeiti', 'Heiti SC', sans-serif; }
            .chapter-text { font-size: 11px; fill: #555; font-family: 'SimSun', 'STSong', 'Songti SC', serif; }
            .item-text { font-size: 11.5px; fill: #000; font-family: 'SimSun', 'STSong', 'Songti SC', serif; }
            .detail-text { font-size: 10.5px; fill: #444; font-family: 'SimSun', 'STSong', 'Songti SC', serif; }
            .result-text { font-size: 12px; fill: #000; font-family: 'SimSun', 'STSong', 'Songti SC', serif; }
        </style>
    </defs>

    <!-- ===== 第1层：顶部总标题 ===== -->
    <rect x="220" y="20" width="440" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="440" y="47" text-anchor="middle" class="title-text">基于LangChain的在线考试与智能判分系统</text>

    <!-- 总标题到4个模块的连接线 -->
    <line x1="330" y1="64" x2="130" y2="110" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="400" y1="64" x2="340" y2="110" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="480" y1="64" x2="540" y2="110" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="550" y1="64" x2="750" y2="110" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== 第2层：四个研究内容模块 ===== -->
    <rect x="30" y="110" width="200" height="56" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
    <text x="130" y="134" text-anchor="middle" class="module-text">智能评分方案设计</text>
    <text x="130" y="153" text-anchor="middle" class="chapter-text">（第3章）</text>

    <rect x="240" y="110" width="200" height="56" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
    <text x="340" y="134" text-anchor="middle" class="module-text">逐点评分与投票机制</text>
    <text x="340" y="153" text-anchor="middle" class="chapter-text">（第3章）</text>

    <rect x="450" y="110" width="200" height="56" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
    <text x="550" y="134" text-anchor="middle" class="module-text">在线考试系统实现</text>
    <text x="550" y="153" text-anchor="middle" class="chapter-text">（第4章）</text>

    <rect x="660" y="110" width="190" height="56" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
    <text x="755" y="134" text-anchor="middle" class="module-text">对比实验验证</text>
    <text x="755" y="153" text-anchor="middle" class="chapter-text">（第3章）</text>

    <!-- 模块到子项的连接线 -->
    <line x1="130" y1="166" x2="130" y2="200" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="340" y1="166" x2="340" y2="200" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="550" y1="166" x2="550" y2="200" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="755" y1="166" x2="755" y2="200" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== 第3层：各模块子项 ===== -->
    <!-- 模块1 子项 -->
    <rect x="20" y="200" width="220" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="130" y="217" text-anchor="middle" class="item-text">PromptTemplate提示词模板</text>
    <text x="130" y="233" text-anchor="middle" class="detail-text">管理评分提示词，支持变量渲染</text>

    <line x1="130" y1="242" x2="130" y2="254" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <rect x="20" y="254" width="220" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="130" y="271" text-anchor="middle" class="item-text">JsonOutputParser输出解析</text>
    <text x="130" y="287" text-anchor="middle" class="detail-text">结构化解析LLM响应为JSON</text>

    <line x1="130" y1="296" x2="130" y2="308" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <rect x="20" y="308" width="220" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="130" y="325" text-anchor="middle" class="item-text">LCEL管道语法</text>
    <text x="130" y="341" text-anchor="middle" class="detail-text">组件串联为可复用的评分调用链</text>

    <!-- 模块2 子项 -->
    <rect x="240" y="200" width="200" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="340" y="217" text-anchor="middle" class="item-text">评分细则自动拆解</text>
    <text x="340" y="233" text-anchor="middle" class="detail-text">标准答案→结构化得分点列表</text>

    <line x1="340" y1="242" x2="340" y2="254" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <rect x="240" y="254" width="200" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="340" y="271" text-anchor="middle" class="item-text">逐点FULL/MISS判定</text>
    <text x="340" y="287" text-anchor="middle" class="detail-text">对每个得分点独立命中判定</text>

    <line x1="340" y1="296" x2="340" y2="308" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <rect x="240" y="308" width="200" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="340" y="325" text-anchor="middle" class="item-text">三LLM多数投票</text>
    <text x="340" y="341" text-anchor="middle" class="detail-text">严格模式下三次独立评分取多数票</text>

    <!-- 模块3 子项 -->
    <rect x="450" y="200" width="200" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="550" y="217" text-anchor="middle" class="item-text">用户与权限管理</text>
    <text x="550" y="233" text-anchor="middle" class="detail-text">管理员/教师/学生三角色+JWT认证</text>

    <line x1="550" y1="242" x2="550" y2="254" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <rect x="450" y="254" width="200" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="550" y="271" text-anchor="middle" class="item-text">试题·试卷·考试管理</text>
    <text x="550" y="287" text-anchor="middle" class="detail-text">题库管理、组卷、发布考试</text>

    <line x1="550" y1="296" x2="550" y2="308" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <rect x="450" y="308" width="200" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="550" y="325" text-anchor="middle" class="item-text">在线答题与成绩管理</text>
    <text x="550" y="341" text-anchor="middle" class="detail-text">草稿保存、交卷、逐点评分详情</text>

    <!-- 模块4 子项 -->
    <rect x="660" y="200" width="190" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="755" y="217" text-anchor="middle" class="item-text">测试数据集构建</text>
    <text x="755" y="233" text-anchor="middle" class="detail-text">90条样本，3个质量梯度</text>

    <line x1="755" y1="242" x2="755" y2="254" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <rect x="660" y="254" width="190" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="755" y="271" text-anchor="middle" class="item-text">四方法横向对比</text>
    <text x="755" y="287" text-anchor="middle" class="detail-text">逐点评分/直接评分/关键词匹配</text>

    <line x1="755" y1="296" x2="755" y2="308" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <rect x="660" y="308" width="190" height="42" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="755" y="325" text-anchor="middle" class="item-text">提示词对照实验</text>
    <text x="755" y="341" text-anchor="middle" class="detail-text">Zero-shot vs Few-shot对比</text>

    <!-- ===== 汇聚线到研究成果 ===== -->
    <line x1="130" y1="350" x2="130" y2="385" stroke="#333" stroke-width="0.8"/>
    <line x1="340" y1="350" x2="340" y2="385" stroke="#333" stroke-width="0.8"/>
    <line x1="550" y1="350" x2="550" y2="385" stroke="#333" stroke-width="0.8"/>
    <line x1="755" y1="350" x2="755" y2="385" stroke="#333" stroke-width="0.8"/>
    <line x1="130" y1="385" x2="755" y2="385" stroke="#333" stroke-width="0.8"/>
    <line x1="440" y1="385" x2="440" y2="410" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== 第4层：研究成果 ===== -->
    <rect x="110" y="410" width="660" height="105" fill="#f0f0f0" stroke="#000" stroke-width="1.2"/>
    <text x="440" y="433" text-anchor="middle" class="module-text">研究成果</text>
    <line x1="150" y1="441" x2="730" y2="441" stroke="#999" stroke-width="0.5"/>
    <text x="160" y="462" text-anchor="start" class="result-text">① 基于LangChain的"评分细则拆解+逐点评分+多模型投票"智能评分方案</text>
    <text x="160" y="482" text-anchor="start" class="result-text">② 采用Django+Vue前后端分离架构的完整在线考试系统</text>
    <text x="160" y="502" text-anchor="start" class="result-text">③ 实验验证：皮尔逊r=0.95，MAE&lt;1分，评分一致率&gt;72%</text>

</svg>
</body>
</html>
