<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图3.2 严格模式多模型投票评分流程图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SimSun', 'STSong', 'Songti SC', serif;
            background: #fff;
            display: flex;
            justify-content: center;
            padding: 30px 10px;
        }
        svg { display: block; }
    </style>
</head>
<body>
<svg width="780" height="640" viewBox="0 0 780 640">
    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#333"/>
        </marker>
        <style>
            .title-text { font-size: 13px; font-weight: bold; fill: #000; font-family: 'SimHei', 'STHeiti', 'Heiti SC', sans-serif; }
            .item-text { font-size: 11.5px; fill: #000; font-family: 'SimSun', 'STSong', 'Songti SC', serif; }
            .detail-text { font-size: 10.5px; fill: #444; font-family: 'SimSun', 'STSong', 'Songti SC', serif; }
            .label-text { font-size: 11px; font-weight: bold; fill: #000; font-family: 'SimHei', 'STHeiti', 'Heiti SC', sans-serif; }
            .full-text { font-size: 11px; font-weight: bold; fill: #000; font-family: 'Consolas', 'Monaco', monospace; }
            .miss-text { font-size: 11px; font-weight: bold; fill: #000; font-family: 'Consolas', 'Monaco', monospace; }
            .vote-text { font-size: 10.5px; fill: #000; font-family: 'SimSun', 'STSong', 'Songti SC', serif; }
        </style>
    </defs>

    <!-- ===== 输入框 ===== -->
    <rect x="240" y="20" width="300" height="40" fill="#e8e8e8" stroke="#000" stroke-width="1.2"/>
    <text x="390" y="45" text-anchor="middle" class="title-text">输入：学生答案 + 评分细则</text>

    <!-- 输入框到三个LLM的分叉线 -->
    <line x1="390" y1="60" x2="390" y2="85" stroke="#333" stroke-width="1"/>
    <line x1="130" y1="85" x2="650" y2="85" stroke="#333" stroke-width="1"/>
    <line x1="130" y1="85" x2="130" y2="110" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="390" y1="85" x2="390" y2="110" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="650" y1="85" x2="650" y2="110" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== LLM评分 #1 ===== -->
    <rect x="50" y="110" width="160" height="36" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
    <text x="130" y="133" text-anchor="middle" class="title-text">LLM评分 #1</text>

    <line x1="130" y1="146" x2="130" y2="165" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <!-- LLM #1 结果卡片 -->
    <rect x="40" y="165" width="180" height="80" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="55" y="185" class="detail-text">得分点1：</text><text x="115" y="185" class="full-text">FULL</text>
    <text x="55" y="205" class="detail-text">得分点2：</text><text x="115" y="205" class="miss-text">MISS</text>
    <text x="55" y="225" class="detail-text">得分点3：</text><text x="115" y="225" class="full-text">FULL</text>
    <text x="55" y="240" class="detail-text">得分：7分</text>

    <!-- ===== LLM评分 #2 ===== -->
    <rect x="310" y="110" width="160" height="36" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
    <text x="390" y="133" text-anchor="middle" class="title-text">LLM评分 #2</text>

    <line x1="390" y1="146" x2="390" y2="165" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <!-- LLM #2 结果卡片 -->
    <rect x="300" y="165" width="180" height="80" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="315" y="185" class="detail-text">得分点1：</text><text x="375" y="185" class="full-text">FULL</text>
    <text x="315" y="205" class="detail-text">得分点2：</text><text x="375" y="205" class="full-text">FULL</text>
    <text x="315" y="225" class="detail-text">得分点3：</text><text x="375" y="225" class="miss-text">MISS</text>
    <text x="315" y="240" class="detail-text">得分：7分</text>

    <!-- ===== LLM评分 #3 ===== -->
    <rect x="570" y="110" width="160" height="36" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
    <text x="650" y="133" text-anchor="middle" class="title-text">LLM评分 #3</text>

    <line x1="650" y1="146" x2="650" y2="165" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>

    <!-- LLM #3 结果卡片 -->
    <rect x="560" y="165" width="180" height="80" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="575" y="185" class="detail-text">得分点1：</text><text x="635" y="185" class="miss-text">MISS</text>
    <text x="575" y="205" class="detail-text">得分点2：</text><text x="635" y="205" class="miss-text">MISS</text>
    <text x="575" y="225" class="detail-text">得分点3：</text><text x="635" y="225" class="full-text">FULL</text>
    <text x="575" y="240" class="detail-text">得分：4分</text>

    <!-- ===== 三路汇聚到投票框 ===== -->
    <line x1="130" y1="245" x2="130" y2="280" stroke="#333" stroke-width="0.8"/>
    <line x1="390" y1="245" x2="390" y2="280" stroke="#333" stroke-width="0.8"/>
    <line x1="650" y1="245" x2="650" y2="280" stroke="#333" stroke-width="0.8"/>
    <line x1="130" y1="280" x2="650" y2="280" stroke="#333" stroke-width="0.8"/>
    <line x1="390" y1="280" x2="390" y2="300" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== 多数投票决策框 ===== -->
    <rect x="265" y="300" width="250" height="40" fill="#e8e8e8" stroke="#000" stroke-width="1.2"/>
    <text x="390" y="325" text-anchor="middle" class="title-text">多数投票决策（≥2票即命中）</text>

    <line x1="390" y1="340" x2="390" y2="370" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== 投票结果明细 ===== -->
    <rect x="210" y="370" width="360" height="140" fill="#f0f0f0" stroke="#000" stroke-width="1"/>
    <text x="390" y="392" text-anchor="middle" class="label-text">逐点投票结果</text>
    <line x1="230" y1="400" x2="550" y2="400" stroke="#999" stroke-width="0.5"/>

    <text x="230" y="420" class="vote-text">得分点1：FULL(2) vs MISS(1)</text>
    <text x="470" y="420" class="full-text">→ FULL</text>
    <text x="520" y="420" class="detail-text">得3分</text>

    <text x="230" y="445" class="vote-text">得分点2：FULL(1) vs MISS(2)</text>
    <text x="470" y="445" class="miss-text">→ MISS</text>
    <text x="520" y="445" class="detail-text">得0分</text>

    <text x="230" y="470" class="vote-text">得分点3：FULL(2) vs MISS(1)</text>
    <text x="470" y="470" class="full-text">→ FULL</text>
    <text x="520" y="470" class="detail-text">得4分</text>

    <line x1="230" y1="480" x2="550" y2="480" stroke="#999" stroke-width="0.5"/>
    <text x="230" y="500" class="item-text">最终得分 = 3 + 0 + 4 = 7分</text>

    <!-- ===== 汇聚到输出 ===== -->
    <line x1="390" y1="510" x2="390" y2="545" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== 输出框 ===== -->
    <rect x="240" y="545" width="300" height="60" fill="#e8e8e8" stroke="#000" stroke-width="1.2"/>
    <text x="390" y="570" text-anchor="middle" class="title-text">输出：最终评分结果</text>
    <text x="390" y="592" text-anchor="middle" class="detail-text">得分7分 + 各得分点命中详情</text>

</svg>
</body>
</html>
